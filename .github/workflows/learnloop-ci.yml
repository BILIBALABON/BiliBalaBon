# LearnLoop：每次 push／PR 跑自動測試（不呼叫模型、不需要金鑰）。專案在 learnloop/ 子資料夾。
name: learnloop-ci
on:
  push:
    paths: ["learnloop/**", ".github/workflows/learnloop-*.yml"]
  pull_request:
    paths: ["learnloop/**", ".github/workflows/learnloop-*.yml"]
defaults:
  run:
    working-directory: learnloop
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg jq
      - run: pip install -r requirements.txt
      - run: python3 -m unittest discover -s tests -v
